<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#0d0d0d">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <title>By the Year | The Mundo League</title>

    <link
        rel="icon"
        type="image/png"
        href="/assets/logos/the-mundo-league-logo.png">

    <link
        rel="apple-touch-icon"
        href="/assets/logos/the-mundo-league-logo.png">

    <link
        rel="stylesheet"
        href="/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header id="navbar">

    <a
        class="logo-small"
        href="/">

        <img
            src="/assets/logos/the-mundo-league-logo.png"
            alt="The Mundo League Logo">

    </a>

    <nav>

        <a href="/">Home</a>

        <a href="/champions/">Champions</a>

        <a
            class="active-nav-link"
            href="/seasons/">

            Seasons

        </a>

        <a href="/#history">History</a>

    </nav>

</header>

<main class="champions-main">

    <section class="champions-header">

        <span class="section-label">

            Seasons

        </span>

        <h1>

            By the Year

        </h1>

        <p>

            Explore The Mundo League season by season.

        </p>

    </section>

    <section class="champions-grid">

        <article class="past-champion-card">

            <div class="champion-year">

                2025 Season

            </div>

            <a
                class="past-champion-button"
                href="/seasons/2025/">

                View Season

            </a>

        </article>

        <article class="past-champion-card">

            <div class="champion-year">

                2024 Season

            </div>

            <a
                class="past-champion-button"
                href="/seasons/2024/">

                View Season

            </a>

        </article>

        <article class="past-champion-card">

            <div class="champion-year">

                2023 Season

            </div>

            <a
                class="past-champion-button"
                href="/seasons/2023/">

                View Season

            </a>

        </article>

    </section>

</main>

<footer class="site-footer">

    <div class="footer-inner">

        <div class="footer-brand">

            <img
                src="/assets/logos/the-mundo-league-logo.png"
                alt="The Mundo League Logo">

            <div>

                <h2>The Mundo League</h2>

                <p>Hall of Fame</p>

            </div>

        </div>

        <nav class="footer-nav">

            <a href="/">Home</a>

            <a href="/champions/">Champions</a>

            <a href="/seasons/">Seasons</a>

            <a href="/#history">History</a>

        </nav>

    </div>

    <p class="footer-copyright">

        © 2026 The Mundo League. All rights reserved.

    </p>

</footer>

<script src="/script.js"></script>

</body>

</html>
